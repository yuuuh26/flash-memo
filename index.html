<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffd43b"><meta name="description" content="すぐ書ける、端末内のメモ帳。"><title>FLASH MEMO</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"></head><body>
<div class="shell"><header><a class="brand" href="#write"><span class="mark">ϟ</span> FLASH MEMO</a><span id="count" class="muted"></span></header>
<nav aria-label="画面切り替え"><button data-view="write" class="active">書く</button><button data-view="list">メモ一覧</button><button data-view="settings">設定・管理</button></nav>
<div id="fatal" role="alert" hidden></div><main>
<section id="write" class="view"><div class="editor-top"><span id="editorLabel" class="eyebrow">NEW MEMO</span><button id="allTags" class="small">タグを選ぶ</button></div><div id="quickTags" class="chips scroll" aria-label="クイックタグ"></div><div id="selectedTags" class="muted"></div>
<textarea id="body" aria-label="メモ本文" placeholder="思いついたことを、そのまま。" spellcheck="true"></textarea><div id="images" class="images"></div>
<div class="editor-tools"><label class="button small">＋ 画像<input id="imageInput" type="file" accept="image/*" multiple hidden></label><label class="button small">カメラ<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden></label><button id="undo" class="small" aria-label="元に戻す">↶ Undo</button><button id="redo" class="small" aria-label="やり直す">↷ Redo</button><button id="copyCurrent" class="small">コピー</button></div>
<div class="next-bar"><button id="next" class="primary">次のメモ</button><div class="save-line"><span id="status" role="status" aria-live="polite">準備中…</span><span id="characters">0文字</span></div></div></section>
<section id="list" class="view" hidden><div class="section-heading"><h1>メモ一覧</h1><button id="selectMode" class="small">複数選択</button></div><input id="search" type="search" placeholder="本文・タグを検索" aria-label="メモ検索"><div class="list-controls"><select id="sort" aria-label="並べ替え"><option value="createdAt">作成日時・新しい順</option><option value="updatedAt">更新日時・新しい順</option></select><button id="filterTags" class="small">タグで絞る</button></div><p id="filterSummary" class="muted"></p><div id="bulk" hidden class="bulk"><strong id="selectionCount"></strong><button id="bulkMerge">マージ</button><button id="bulkTags">タグ編集</button><button id="bulkTrash" class="danger">削除</button></div><div id="memoList"></div></section>
<section id="settings" class="view" hidden><h1>設定・管理</h1><section class="card"><h2>タグ</h2><form id="newTagForm" class="row"><input id="newTag" placeholder="新しいタグ名" aria-label="新しいタグ名" required><button class="primary">追加</button></form><div class="tag-bulk row"><button id="quickAdd">選択をクイックへ</button><button id="quickRemove">クイック解除</button><button id="deleteTags" class="danger">選択を削除</button></div><div id="tagManagement"></div></section>
<section class="card"><h2>バックアップ</h2><p id="backupInfo" class="muted"></p><button id="export" class="primary">JSONエクスポート</button><div id="exportResult" role="status"></div><hr><h3>JSONインポート</h3><label class="field">復元方法<select id="importMode"><option value="merge">追加・統合（現在のデータを残す）</option><option value="replace">全置換（現在のデータを置き換える）</option></select></label><label class="button">JSONファイルを選択<input id="importInput" type="file" accept=".json,application/json" hidden></label><p id="importResult" role="status"></p></section>
<section class="card"><h2>ゴミ箱</h2><p class="muted">自動削除はしません。ここから復元できます。</p><div id="trashList"></div></section>
<section class="card"><h2>保存・アプリ情報</h2><p id="persistence">永続ストレージ：未確認</p><button id="persist">永続ストレージを申請</button><p id="storage" class="muted"></p><p id="offline" class="muted"></p><button id="install" hidden>ホーム画面に追加</button><p class="muted">Chromeのメニューから「ホーム画面に追加」も利用できます。</p><hr><strong>FLASH MEMO</strong><p>v1.0.0 · Made by YUU</p><label class="field">公開URL<input id="publicUrl" readonly></label><button id="copyUrl">URLをコピー</button><p><a href="https://github.com/yuuuh26/flash-memo" target="_blank" rel="noopener">GitHubリポジトリ</a></p><button id="copyRepo">リポジトリURLをコピー</button><p class="muted">メモと画像はこの端末のブラウザ内に保存されます。端末間では自動同期しません。定期的なバックアップをご利用ください。</p></section></section>
</main></div><aside id="reminder" hidden aria-label="バックアップのお知らせ"><strong>📦 新しいメモが15件以上増えました</strong><p>そろそろバックアップしておくと安心です。</p><button id="backupNow" class="primary">今すぐバックアップ</button><button id="backupLater">あとで</button></aside><div id="toast" role="status" aria-live="polite" hidden></div><dialog id="dialog"><div id="dialogContent"></div><button id="closeDialog" class="dialog-close">閉じる</button></dialog><script type="module" src="./js/app.js"></script></body></html>
